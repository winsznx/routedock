name: Bug Report
description: File a bug report to help us improve RouteDock
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Before opening an issue, please verify that you are running Node >= 22.
  - type: input
    id: sdk-version
    attributes:
      label: "@routedock/routedock version"
      description: What version of @routedock/routedock are you using? (e.g. 0.3.1, or commit hash)
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: payment-mode
    attributes:
      label: Payment mode
      description: Which payment mode is being used?
      options:
        - "x402"
        - "mpp-charge"
        - "mpp-session"
        - "mpp-session-ws"
        - "not sure"
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      description: Which Stellar network are you targeting?
      options:
        - "testnet"
        - "pubnet"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: What version of Node.js are you running? (Node >= 22 is required)
      placeholder: "v22.12.0"
    validations:
      required: true
  - type: input
    id: provider-url
    attributes:
      label: Provider URL
      description: URL of the provider endpoint, or self-hosted.
      placeholder: "https://... or self-hosted"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Initialize client with ...
        2. Call pay() with ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and error output
      description: Please paste any relevant logs, stack traces, or console output.
      render: shell
    validations:
      required: false
