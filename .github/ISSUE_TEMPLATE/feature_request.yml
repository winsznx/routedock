name: Feature Request
description: Suggest an idea or feature for RouteDock
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature!
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      description: Which package or component is affected by this feature request?
      options:
        - "sdk"
        - "nulth-sdk"
        - "mcp-server"
        - "apps/*"
        - "contracts"
        - "other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Is your feature request related to a problem? Please describe clearly.
      placeholder: "A clear and concise description of the problem or limitation."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like to see implemented.
      placeholder: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions
      description: Describe any alternative solutions or features you've considered.
    validations:
      required: false
