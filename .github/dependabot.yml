version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 0.x minors here are breaking and need a hand-written migration.
      - dependency-name: "mppx"
      - dependency-name: "@stellar/mpp"
      # Pinned to 2.9.0 by the root override (#650); newer versions
      # duplicate @stellar/stellar-sdk in the Workers bundles.
      - dependency-name: "@x402/*"
      # tsup's DTS build and typescript-eslint don't support TS 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @changesets/cli 3 prints "Created git tags:" instead of "New tag:", which
      # changesets/action (release.yml) parses to decide what to tag and release.
      # Until the action supports that output, a bump would publish to npm with
      # no tags and no GitHub Releases while the workflow stays green (#718).
      # scripts/release-rehearsal.sh (CI job `release-rehearsal`) fails on it.
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
