name: Release
on:
  push:
    branches: [ main ]
permissions:
  issues: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          corepack enable
          pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
      - if: failure()
        run: gh issue create --title "Release failed" --body "Release workflow failed"